services:
  marketplace-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - marketplace-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  marketplace-api:
    build:
      context: .
      dockerfile: ./apps/marketplace/Dockerfile
      target: api
    environment: &marketplace-env
      MARKETPLACE_DATABASE_URL: postgres://marketplace:marketplace@marketplace-db:5432/marketplace?sslmode=disable
      MARKETPLACE_REDIS_URL: redis://redis:6379/0
      MARKETPLACE_ADMIN_EMAIL: admin@example.test
      MARKETPLACE_ADMIN_PASSWORD: change-me-now
      MARKETPLACE_ENCRYPTION_KEY: development-only-encryption-key-change-me
      MARKETPLACE_SESSION_SECRET: development-only-session-secret-change-me
      MARKETPLACE_RATE_LIMIT_PER_MINUTE: "100"
      MARKETPLACE_SEED_ON_BOOT: "true"
      MARKETPLACE_DEADLINE_POLL_INTERVAL: "1s"
      MARKETPLACE_DEADLINE_LEASE: "30s"
      MARKETPLACE_DEADLINE_BATCH_SIZE: "100"
      MARKETPLACE_DEADLINE_CONCURRENCY: "8"
    ports:
      - "18080:8080"
    depends_on:
      marketplace-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  marketplace-worker:
    build:
      context: .
      dockerfile: ./apps/marketplace/Dockerfile
      target: worker
    environment: *marketplace-env
    depends_on:
      marketplace-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  marketplace-admin:
    build:
      context: ./apps/marketplace/admin
      args:
        VITE_API_BASE_URL: http://localhost:18080
    ports:
      - "5173:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      - marketplace-api

volumes:
  marketplace-data:
