openapi: 3.0.3
info:
  title: Marketplace Simulator API
  version: 1.0.0
  description: |
    A provider-aware marketplace API. Order and fulfillment contracts are only
    available through `SHOPEE_LIKE` and `TOKOPEDIA_LIKE`; Generic is not an
    order-provider profile.

    Shared warehouse and webhook requests under `/api/v1` are HMAC-SHA256 signed using `METHOD + PATH + UNIX_TIMESTAMP + RAW_BODY`.
    Every mutating public operation across the shared, Shopee-like, and
    Tokopedia-like contracts require an `Idempotency-Key`. Concurrent use is
    claimed atomically, completed responses are replayed, and reusing a key for
    a different logical request returns `409`.

    Successful and rate-limited public responses expose `X-RateLimit-Limit`,
    `X-RateLimit-Remaining`, and `X-RateLimit-Reset` (Unix seconds). Public requests can return
    `503 MARKETPLACE_MAINTENANCE` when the administrator enables global maintenance mode.

    Webhooks are asynchronous. A 2xx response succeeds; all other responses and network failures
    retry at 30 seconds, 2 minutes, 10 minutes, and 30 minutes. Delivery attempts are immutable.
    Per-shop scenarios can inject slow responses, random 500s, timeouts, rate limits, duplicate,
    delayed, out-of-order, and failed webhook deliveries without affecting other shops.

    `SHOPEE_LIKE` shops additionally expose `/api/shopee/v1`. This is a distinct
    partner-style contract: use `X-Shopee-Partner-Id`, `X-Shopee-Timestamp`, and
    `X-Shopee-Signature`, where the signature is HMAC-SHA256 of
    `PARTNER_ID + PATH + TIMESTAMP + RAW_BODY`. It uses `page_no`/`page_size`,
    Shopee-like names such as `order_sn`, a `{error,message,request_id,response}`
    envelope, and `X-Shopee-Api-Call-Limit`. It is simulator-owned, not a claim
    of compatibility with Shopee production APIs.

    `TOKOPEDIA_LIKE` represents the combined Tokopedia & Shop / TikTok Shop
    Partner Center boundary. It exposes `/api/tokopedia/v202309` with `app_key`,
    `timestamp`, and `sign` query parameters plus `x-tts-access-token`. `sign`
    wraps the path, sorted query (excluding `sign` and `access_token`), and raw
    body with the app secret using HMAC-SHA256. Responses use `{code,message,
    request_id,data}`, opaque page tokens, and external lifecycle terms such as
    `ON_HOLD`, `AWAITING_COLLECTION`, and `IN_TRANSIT`.
servers:
  - url: http://localhost:18080
tags:
  - name: Products
  - name: Orders
  - name: Fulfillment
  - name: Warehouses
  - name: Webhooks
  - name: Tokopedia Like
  - name: Control Plane
paths:
  /health:
    get:
      operationId: health
      summary: Process liveness
      responses: { '200': { description: Running } }
  /ready:
    get:
      operationId: ready
      summary: Dependency readiness
      responses: { '200': { description: Ready }, '503': { $ref: '#/components/responses/Error' } }
  /control/v1/auth/register:
    post:
      operationId: registerControlPlaneOperator
      tags: [Control Plane]
      summary: Register an operator account and receive a control-plane session
      description: Self-registration creates an OPERATOR account only. Use the returned bearer token for the Admin Control Plane; it is not an integration credential and cannot sign Marketplace API requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: developer@example.test }
                password: { type: string, minLength: 8, example: practice-password }
      responses:
        '201':
          description: Operator account and first session created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlPlaneSession' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /control/v1/shops/{id}/events:
    get:
      operationId: listControlShopEvents
      tags: [Control Plane]
      summary: Inspect shop events with resource filters and delivery links
      security: [{ ControlPlaneBearer: [] }]
      description: Filters apply before pagination. Resource ID is an exact aggregate match; order detail additionally includes events from its shipments. Archived product events are retained. Newest events sort first by occurred_at then id. A canonical payload is not the transformed signed webhook body; inspect delivery attempts for that evidence.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: resource_type, in: query, schema: { type: string, enum: [order, product, shipment] } }
        - { name: aggregate_id, in: query, schema: { type: string } }
        - { name: event_type, in: query, schema: { type: string }, description: Exact canonical event name. }
      responses:
        '200':
          description: Shop events with pagination and matching deliveries.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ControlEvent' } }
                  pagination: { $ref: '#/components/schemas/PagePagination' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /control/v1/shipments/{id}:
    get:
      operationId: getControlShipment
      tags: [Control Plane, Fulfillment]
      summary: Inspect shipment, linked order and warehouse, and shipment events
      security: [{ ControlPlaneBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      description: Shipment aggregate events cover failure and return to sender. Normal shipping milestones are recorded on the linked order. Product and shipment event rows include matching delivery links.
      responses:
        '200':
          description: Canonical shipment detail and its event trail.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [id, shop_id, order_id, package_id, status, warehouse, events]
                properties:
                  id: { type: string }
                  shop_id: { type: string }
                  order_id: { type: string }
                  package_id: { type: string }
                  status: { type: string }
                  warehouse: { type: object, additionalProperties: true }
                  events: { type: array, items: { $ref: '#/components/schemas/ControlEvent' } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /control/v1/orders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getControlOrder
      tags: [Control Plane, Orders]
      summary: Inspect canonical order, legal console actions and event/delivery history
      security: [{ ControlPlaneBearer: [] }]
      description: The event and delivery trails include related shipment aggregates, including delivery failure and return events. operations.payment_status is authoritative. Legacy payment.status only reports whether paid_at exists. Action eligibility is a read snapshot; mutations revalidate the locked state. Provider API status is mapped separately; webhook payloads retain canonical statuses.
      responses:
        '200':
          description: Order with current action eligibility.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlOrderDetail' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /control/v1/orders/{id}/actions/{action}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: action, in: path, required: true, schema: { type: string, enum: [pay, payment_failed, process, ready_to_ship, complete, cancel] } }
    post:
      operationId: simulateControlOrderAction
      tags: [Control Plane, Orders]
      summary: Simulate a legal order action with explicit cancellation context
      security: [{ ControlPlaneBearer: [] }]
      description: |
        Payment and completion simulate payment/customer events. Process and ready_to_ship are console equivalents of merchant API work. Carrier movement uses shipment actions.
        Cancellation accepts CUSTOMER or SELLER plus an enumerated reason. Shopee CUSTOMER may cancel UNPAID/PAID; SELLER may cancel PAID/PROCESSING. Tokopedia permits these actors through READY_TO_SHIP. SYSTEM outcomes come from payment failure/expiry or seller deadlines. Legacy empty cancellation bodies retain SELLER/OUT_OF_STOCK behavior; the Admin UI always submits explicit fields.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actor: { type: string, enum: [CUSTOMER, SELLER], description: Required together with reason for explicit cancellation. }
                reason: { type: string, enum: [CHANGE_OF_MIND, DUPLICATE_ORDER, ADDRESS_ISSUE, OUT_OF_STOCK, SELLER_UNFULFILLABLE], description: First three reasons belong to CUSTOMER; last two belong to SELLER. }
      responses:
        '200': { description: Order action applied; refresh order detail. }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /control/v1/deliveries/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getControlDelivery
      tags: [Control Plane, Webhooks]
      summary: Inspect immutable webhook attempts and their source event
      security: [{ ControlPlaneBearer: [] }]
      description: |
        Restricted to the shop owner or administrator. Each new attempt captures its actual application headers, exact signed body string, destination, provider, signing client identity, start time, response, truncation flag and failure reason. Secrets are never returned. Transport-generated HTTP headers are not captured.
        Signing failures have no request body and http_attempted=false; forced failures preserve the prepared request but do not send it. http_attempted=true means the HTTP client was invoked, not that the receiver accepted the body. Legacy attempts have null snapshot fields and cannot be reconstructed from current settings. Response bodies are capped at 4096 bytes. Historical signature verification is an integrity exercise; receiver freshness and application processing must be checked separately.
      responses:
        '200':
          description: Delivery, current registration context, canonical event and historical attempts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ControlDeliveryDetail' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /control/v1/shops/{id}/products:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Shop id. }
    get:
      operationId: listControlProducts
      tags: [Control Plane, Products]
      summary: List products managed by a shop owner or administrator
      security: [{ ControlPlaneBearer: [] }]
      responses:
        '200': { description: Paginated control-plane catalogue. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createControlProduct
      tags: [Control Plane, Products]
      summary: Create a product and its initial warehouse inventory
      security: [{ ControlPlaneBearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ControlProductInput' } } }
      responses:
        '201': { description: Product created., content: { application/json: { schema: { $ref: '#/components/schemas/ControlProduct' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /control/v1/shops/{id}/products/{productID}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Shop id. }
      - { name: productID, in: path, required: true, schema: { type: string } }
    get:
      operationId: getControlProduct
      tags: [Control Plane, Products]
      summary: Inspect product catalog fields, warehouse inventory, and product events
      security: [{ ControlPlaneBearer: [] }]
      responses:
        '200':
          description: Includes every shop warehouse, including inactive warehouses and zero quantities for unassigned products.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ControlProduct' }
                  - type: object
                    properties:
                      events: { type: array, items: { $ref: '#/components/schemas/ControlEvent' } }
                      warehouse_inventory: { type: array, items: { $ref: '#/components/schemas/ControlProductWarehouse' } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateControlProduct
      tags: [Control Plane, Products]
      summary: Update catalogue metadata; adjust physical stock through warehouse inventory
      security: [{ ControlPlaneBearer: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ControlProductPatch' } } }
      responses:
        '200': { description: Product updated., content: { application/json: { schema: { $ref: '#/components/schemas/ControlProduct' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: archiveControlProduct
      tags: [Control Plane, Products]
      summary: Archive an unreserved product while preserving order history
      security: [{ ControlPlaneBearer: [] }]
      responses:
        '204': { description: Product archived. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/shopee/v1/orders:
    get:
      operationId: shopeeListOrders
      tags: [Orders]
      summary: List SHOPEE_LIKE orders with page-number pagination
      description: Copy response.order_list[].order_id into every order {id} path. The order_sn field is the human-readable order number, not the API identifier. time_from and time_to filter create_time, not update_time.
      parameters: [{ $ref: '#/components/parameters/ShopeePartnerID' }, { $ref: '#/components/parameters/ShopeeTimestamp' }, { $ref: '#/components/parameters/ShopeeSignature' }, { name: page_no, in: query, schema: { type: integer, minimum: 1, default: 1 } }, { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }, { name: order_status, in: query, schema: { type: string } }, { name: time_from, in: query, description: Inclusive lower bound for order create_time in Unix seconds; update_time is not filtered., schema: { type: integer, format: int64 } }, { name: time_to, in: query, description: Inclusive upper bound for order create_time in Unix seconds; update_time is not filtered., schema: { type: integer, format: int64 } }]
      responses: { '200': { $ref: '#/components/responses/ShopeeResponse' }, '400': { $ref: '#/components/responses/ShopeeError' }, '401': { $ref: '#/components/responses/ShopeeError' }, '403': { $ref: '#/components/responses/ShopeeError' }, '429': { $ref: '#/components/responses/ShopeeError' } }
  /api/shopee/v1/products:
    get:
      operationId: shopeeListProducts
      tags: [Products]
      summary: List SHOPEE_LIKE catalogue items with Shopee-like terminology
      parameters: [{ $ref: '#/components/parameters/ShopeePartnerID' }, { $ref: '#/components/parameters/ShopeeTimestamp' }, { $ref: '#/components/parameters/ShopeeSignature' }, { name: page_no, in: query, schema: { type: integer, minimum: 1, default: 1 } }, { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }, { name: item_status, in: query, schema: { type: string, enum: [ACTIVE, INACTIVE] } }, { name: item_name, in: query, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/ShopeeResponse' }, '400': { $ref: '#/components/responses/ShopeeError' }, '401': { $ref: '#/components/responses/ShopeeError' }, '429': { $ref: '#/components/responses/ShopeeError' } }
  /api/shopee/v1/products/{id}:
    get:
      operationId: shopeeGetProduct
      tags: [Products]
      summary: Get one SHOPEE_LIKE catalogue item
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/ShopeePartnerID' }, { $ref: '#/components/parameters/ShopeeTimestamp' }, { $ref: '#/components/parameters/ShopeeSignature' }]
      responses: { '200': { $ref: '#/components/responses/ShopeeResponse' }, '401': { $ref: '#/components/responses/ShopeeError' }, '404': { $ref: '#/components/responses/ShopeeError' } }
  /api/shopee/v1/orders/{id}:
    parameters: [{ name: id, in: path, required: true, description: "API order_id from response.order_list; order_sn is the display number and is not accepted here.", schema: { type: string } }]
    get:
      operationId: shopeeGetOrder
      tags: [Orders]
      summary: Get a SHOPEE_LIKE order using provider terminology
      parameters: [{ $ref: '#/components/parameters/ShopeePartnerID' }, { $ref: '#/components/parameters/ShopeeTimestamp' }, { $ref: '#/components/parameters/ShopeeSignature' }]
      responses: { '200': { $ref: '#/components/responses/ShopeeOrderDetailResponse' }, '401': { $ref: '#/components/responses/ShopeeError' }, '404': { $ref: '#/components/responses/ShopeeError' } }
  /api/shopee/v1/orders/{id}/cancel:
    post:
      operationId: shopeeCancelOrder
      tags: [Orders]
      summary: Customer cancellation with Shopee-like request/error contract
      parameters: [{ name: id, in: path, required: true, description: "API order_id from response.order_list; order_sn is the display number and is not accepted here.", schema: { type: string } }, { $ref: '#/components/parameters/ShopeePartnerID' }, { $ref: '#/components/parameters/ShopeeTimestamp' }, { $ref: '#/components/parameters/ShopeeSignature' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [cancel_reason], properties: { cancel_reason: { type: string, enum: [CHANGE_OF_MIND, DUPLICATE_ORDER, ADDRESS_ISSUE] } } } } } }
      responses: { '200': { $ref: '#/components/responses/ShopeeResponse' }, '400': { $ref: '#/components/responses/ShopeeError' }, '401': { $ref: '#/components/responses/ShopeeError' }, '409': { $ref: '#/components/responses/ShopeeError' }, '413': { $ref: '#/components/responses/ShopeeError' } }
  /api/shopee/v1/orders/{id}/ship-order:
    post:
      operationId: shopeeProcessOrder
      tags: [Orders]
      summary: Move a paid SHOPEE_LIKE order into seller processing
      parameters: [{ name: id, in: path, required: true, description: "API order_id from response.order_list; order_sn is the display number and is not accepted here.", schema: { type: string } }, { $ref: '#/components/parameters/ShopeePartnerID' }, { $ref: '#/components/parameters/ShopeeTimestamp' }, { $ref: '#/components/parameters/ShopeeSignature' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/ShopeeResponse' }, '400': { $ref: '#/components/responses/ShopeeError' }, '401': { $ref: '#/components/responses/ShopeeError' }, '409': { $ref: '#/components/responses/ShopeeError' }, '413': { $ref: '#/components/responses/ShopeeError' } }
  /api/shopee/v1/orders/{id}/ready-to-ship:
    post:
      operationId: shopeeReadyToShipOrder
      tags: [Orders]
      summary: Mark a SHOPEE_LIKE seller-processed order ready for fulfillment
      parameters: [{ name: id, in: path, required: true, description: "API order_id from response.order_list; order_sn is the display number and is not accepted here.", schema: { type: string } }, { $ref: '#/components/parameters/ShopeePartnerID' }, { $ref: '#/components/parameters/ShopeeTimestamp' }, { $ref: '#/components/parameters/ShopeeSignature' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/ShopeeResponse' }, '400': { $ref: '#/components/responses/ShopeeError' }, '401': { $ref: '#/components/responses/ShopeeError' }, '409': { $ref: '#/components/responses/ShopeeError' }, '413': { $ref: '#/components/responses/ShopeeError' } }
  /api/shopee/v1/orders/{id}/packages:
    post:
      operationId: shopeeCreatePackage
      tags: [Fulfillment]
      summary: Allocate selected order items into a Shopee-like package
      parameters: [{ name: id, in: path, required: true, description: "API order_id from response.order_list; order_sn is the display number and is not accepted here.", schema: { type: string } }, { $ref: '#/components/parameters/ShopeePartnerID' }, { $ref: '#/components/parameters/ShopeeTimestamp' }, { $ref: '#/components/parameters/ShopeeSignature' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PackageInput' } } } }
      responses: { '200': { $ref: '#/components/responses/ShopeeResponse' }, '400': { $ref: '#/components/responses/ShopeeError' }, '401': { $ref: '#/components/responses/ShopeeError' }, '409': { $ref: '#/components/responses/ShopeeError' }, '413': { $ref: '#/components/responses/ShopeeError' } }
  /api/shopee/v1/orders/{id}/shipments:
    post:
      operationId: shopeeCreateShipment
      tags: [Fulfillment]
      summary: Create a Shopee-like shipment for a ready-to-ship order
      parameters: [{ name: id, in: path, required: true, description: "API order_id from response.order_list; order_sn is the display number and is not accepted here.", schema: { type: string } }, { $ref: '#/components/parameters/ShopeePartnerID' }, { $ref: '#/components/parameters/ShopeeTimestamp' }, { $ref: '#/components/parameters/ShopeeSignature' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ShipmentInput' } } } }
      responses: { '200': { $ref: '#/components/responses/ShopeeShipmentCreatedResponse' }, '400': { $ref: '#/components/responses/ShopeeError' }, '401': { $ref: '#/components/responses/ShopeeError' }, '409': { $ref: '#/components/responses/ShopeeError' }, '413': { $ref: '#/components/responses/ShopeeError' } }
  /api/shopee/v1/webhooks:
    get:
      operationId: shopeeListWebhooks
      tags: [Webhooks]
      summary: List provider-style webhook registrations
      parameters: [{ $ref: '#/components/parameters/ShopeePartnerID' }, { $ref: '#/components/parameters/ShopeeTimestamp' }, { $ref: '#/components/parameters/ShopeeSignature' }]
      responses: { '200': { $ref: '#/components/responses/ShopeeResponse' }, '401': { $ref: '#/components/responses/ShopeeError' } }
    post:
      operationId: shopeeCreateWebhook
      description: item_update covers product events. logistics_status_update covers order shipped/in_delivery/delivered and shipment delivery_failed/returning/returned. order_status_update covers other order events including payment failure/expiry and seller deadline expiry.
      tags: [Webhooks]
      summary: Register callback_url for item_update, order_status_update, or logistics_status_update
      parameters: [{ $ref: '#/components/parameters/ShopeePartnerID' }, { $ref: '#/components/parameters/ShopeeTimestamp' }, { $ref: '#/components/parameters/ShopeeSignature' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [callback_url, event_types], properties: { callback_url: { type: string, format: uri }, secret: { type: string }, event_types: { type: array, items: { type: string, enum: [item_update, order_status_update, logistics_status_update] } } } } } } }
      responses: { '200': { $ref: '#/components/responses/ShopeeResponse' }, '400': { $ref: '#/components/responses/ShopeeError' }, '401': { $ref: '#/components/responses/ShopeeError' }, '409': { $ref: '#/components/responses/ShopeeError' }, '413': { $ref: '#/components/responses/ShopeeError' } }
  /api/tokopedia/v202309/orders/search:
    post:
      operationId: tokopediaSearchOrders
      tags: [Tokopedia Like]
      summary: Search TOKOPEDIA_LIKE orders with opaque page-token pagination
      parameters: [{ $ref: '#/components/parameters/TokopediaAppKey' }, { $ref: '#/components/parameters/TokopediaTimestamp' }, { $ref: '#/components/parameters/TokopediaSign' }, { $ref: '#/components/parameters/TokopediaAccessToken' }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { page_size: { type: integer, minimum: 1, maximum: 100, default: 20 }, page_token: { type: string }, order_status: { type: string, enum: [UNPAID, ON_HOLD, AWAITING_SHIPMENT, AWAITING_COLLECTION, IN_TRANSIT, DELIVERED, COMPLETED, CANCEL] } } } } } }
      responses: { '200': { $ref: '#/components/responses/TokopediaResponse' }, '400': { $ref: '#/components/responses/TokopediaError' }, '429': { $ref: '#/components/responses/TokopediaError' } }
  /api/tokopedia/v202309/products/search:
    post:
      operationId: tokopediaSearchProducts
      tags: [Tokopedia Like, Products]
      summary: Search TOKOPEDIA_LIKE products with opaque page tokens
      parameters: [{ $ref: '#/components/parameters/TokopediaAppKey' }, { $ref: '#/components/parameters/TokopediaTimestamp' }, { $ref: '#/components/parameters/TokopediaSign' }, { $ref: '#/components/parameters/TokopediaAccessToken' }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { page_size: { type: integer, minimum: 1, maximum: 100, default: 20 }, page_token: { type: string }, keyword: { type: string } } } } } }
      responses: { '200': { $ref: '#/components/responses/TokopediaResponse' }, '400': { $ref: '#/components/responses/TokopediaError' }, '429': { $ref: '#/components/responses/TokopediaError' } }
  /api/tokopedia/v202309/products/{id}:
    get:
