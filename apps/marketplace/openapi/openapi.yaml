      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/TokopediaAppKey' }, { $ref: '#/components/parameters/TokopediaTimestamp' }, { $ref: '#/components/parameters/TokopediaSign' }, { $ref: '#/components/parameters/TokopediaAccessToken' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ShipmentInput' } } } }
      responses: { '200': { $ref: '#/components/responses/TokopediaShipmentCreatedResponse' }, '400': { $ref: '#/components/responses/TokopediaError' }, '401': { $ref: '#/components/responses/TokopediaError' }, '409': { $ref: '#/components/responses/TokopediaError' }, '413': { $ref: '#/components/responses/TokopediaError' }, '429': { $ref: '#/components/responses/TokopediaError' } }
  /api/tokopedia/v202309/webhooks:
    put:
      description: ORDER_STATUS_CHANGE (body type 1) includes payment failure/expiry and seller deadline expiry. PACKAGE_UPDATE (type 4) includes shipment delivery failure and return-to-sender events plus order shipment movement. PRODUCT_INFORMATION_CHANGE is type 15. The optional registration secret is unused for delivery verification. Delivery Authorization uses APP_KEY plus raw body with the oldest ACTIVE shop credential secret (creation time then credential ID).
      operationId: tokopediaConfigureWebhooks
      tags: [Tokopedia Like, Webhooks]
      summary: Configure a TOKOPEDIA_LIKE callback for order, package, or product notifications
      parameters: [{ $ref: '#/components/parameters/TokopediaAppKey' }, { $ref: '#/components/parameters/TokopediaTimestamp' }, { $ref: '#/components/parameters/TokopediaSign' }, { $ref: '#/components/parameters/TokopediaAccessToken' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [callback_url, event_types], properties: { callback_url: { type: string, format: uri }, secret: { type: string, description: Legacy optional registration secret; unused for Tokopedia delivery verification. Use the oldest ACTIVE app credential secret. }, event_types: { type: array, items: { type: string, enum: [ORDER_STATUS_CHANGE, PACKAGE_UPDATE, PRODUCT_INFORMATION_CHANGE] } } } } } } }
      responses: { '200': { $ref: '#/components/responses/TokopediaResponse' }, '400': { $ref: '#/components/responses/TokopediaError' }, '401': { $ref: '#/components/responses/TokopediaError' }, '409': { $ref: '#/components/responses/TokopediaError' }, '413': { $ref: '#/components/responses/TokopediaError' }, '429': { $ref: '#/components/responses/TokopediaError' } }
  /api/v1/warehouses:
    get:
      operationId: listWarehouses
      tags: [Warehouses]
      summary: List fulfillment warehouses for the credential shop
      description: Warehouses are read-only from the public API. This operation returns the complete shop-scoped collection and is intentionally unpaginated. Orders reserve all lines at one ACTIVE warehouse at creation. The largest priority that can fulfill every line wins; ties use code alphabetically. Stock cannot be combined across warehouses. Warehouse administration stays in the control plane.
      parameters: [{ $ref: '#/components/parameters/ClientID' }, { $ref: '#/components/parameters/Timestamp' }, { $ref: '#/components/parameters/Signature' }]
      responses: { '200': { $ref: '#/components/responses/RateLimitedWarehouseList' }, '401': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/Maintenance' } }
  /api/v1/warehouses/{id}:
    get:
      operationId: getWarehouse
      tags: [Warehouses]
      summary: Get one warehouse and its product inventory
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/ClientID' }, { $ref: '#/components/parameters/Timestamp' }, { $ref: '#/components/parameters/Signature' }]
      responses: { '200': { $ref: '#/components/responses/RateLimitedWarehouse' }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/Maintenance' } }
  /api/v1/webhooks:
    get:
      operationId: listWebhooks
      tags: [Webhooks]
      summary: List webhook registrations with page-number pagination
      description: Returns at most limit registrations. Increment page while pagination.has_next is true. Stored webhook secrets are never listed.
      parameters: [{ $ref: '#/components/parameters/ClientID' }, { $ref: '#/components/parameters/Timestamp' }, { $ref: '#/components/parameters/Signature' }, { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }]
      responses: { '200': { $ref: '#/components/responses/RateLimitedWebhookList' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/Maintenance' } }
    post:
      operationId: createWebhook
      tags: [Webhooks]
      description: Delivery format follows the shop provider even through this shared registration API. The registration secret verifies Shopee deliveries only; Tokopedia uses the oldest ACTIVE app credential.
      summary: Register a webhook; omit secret to have one generated and returned once
      parameters: [{ $ref: '#/components/parameters/ClientID' }, { $ref: '#/components/parameters/Timestamp' }, { $ref: '#/components/parameters/Signature' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [url, subscribed_events], properties: { url: { type: string, format: uri }, secret: { type: string, writeOnly: true }, subscribed_events: { type: array, items: { type: string, enum: [product.created, product.updated, product.deleted, order.created, order.paid, order.payment_failed, order.payment_expired, order.processing, order.ready_to_ship, order.shipped, order.in_delivery, order.delivered, order.completed, order.cancelled, order.sla_expired, shipment.delivery_failed, shipment.returning, shipment.returned] } } } } } } }
      responses: { '201': { $ref: '#/components/responses/RateLimitedWebhookRegistration' }, '400': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '413': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/Maintenance' } }
  /api/v1/webhooks/{id}:
    delete:
      operationId: deleteWebhook
      tags: [Webhooks]
      summary: Delete a webhook registration
      description: Stops future fanout and cancels pending deliveries while preserving delivery/attempt history in the control plane. An in-flight HTTP attempt may finish. Deleted registrations cannot be retried; register a new callback and replay the event. Reset to seed intentionally clears shop history.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/ClientID' }, { $ref: '#/components/parameters/Timestamp' }, { $ref: '#/components/parameters/Signature' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '204': { description: Webhook deleted, headers: { X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }, X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }, X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' } } }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '413': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/RateLimited' }, '503': { $ref: '#/components/responses/Maintenance' } }
webhooks:
  shopee.event:
    post:
      tags: [Webhooks]
      summary: SHOPEE_LIKE delivery regardless of registration route
      description: >-
        Verify hex HMAC-SHA256 of EVENT + TIMESTAMP + RAW_BODY (no separators) with the
        registration webhook secret. EVENT and TIMESTAMP are the X-Shopee header values.
        Verify raw bytes and timestamp freshness before processing. Deduplicate on
        X-Shopee-Event-Id, which equals body request_id. Replacing the registration secret
        changes the key used on subsequent attempts including retries. Payload data has canonical simulator fields/statuses.
        A 2xx acknowledges durable acceptance; other responses/network failures retry at 30s, 2m, 10m, 30m.
        Duplicates and replays retain event identity; events may arrive out of order.
      parameters:
        - { name: X-Shopee-Event, in: header, required: true, schema: { type: string, enum: [item_update, order_status_update, logistics_status_update] } }
        - { name: X-Shopee-Event-Id, in: header, required: true, schema: { type: string } }
        - { name: X-Shopee-Timestamp, in: header, required: true, schema: { type: string }, description: Unix seconds of this attempt. }
        - { name: X-Shopee-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, message, request_id, response]
              properties:
                code: { type: integer, enum: [0] }
                message: { type: string }
                request_id: { type: string }
                response:
                  type: object
                  required: [event_type, data]
                  properties:
                    event_type: { type: string }
                    data: { type: object, additionalProperties: true }
            example: { code: 0, message: success, request_id: evt_example, response: { event_type: order_status_update, data: { order_id: ord_example, status: PAID } } }
      responses: { '204': { description: Event durably accepted or already accepted }, '400': { description: Receiver rejected payload; simulator retries } }
  tokopedia.event:
    post:
      tags: [Webhooks]
      summary: TOKOPEDIA_LIKE delivery regardless of registration route
      description: >-
        Verify Authorization as hex HMAC-SHA256 of APP_KEY + RAW_BODY using APP_SECRET.
        APP_KEY/APP_SECRET belong to the oldest ACTIVE shop credential, ordered by created_at then id,
        selected anew on every attempt. APP_KEY is its client_id. Revocation selects the next active
        credential; with none active, signing fails before an HTTP request. Creating a newer credential
        does not rotate the key. The optional callback registration secret is unused.
        Verify raw bytes before parsing, check body timestamp freshness, and deduplicate on tts_notification_id.
        No X-Marketplace or X-Shopee headers are sent. Data contains canonical simulator fields/statuses.
        A 2xx acknowledges durable acceptance; other responses/network failures retry at 30s, 2m, 10m, 30m.
        Duplicates and replays retain notification identity; events may arrive out of order.
      parameters:
        - { name: Authorization, in: header, required: true, schema: { type: string }, description: Raw hex HMAC with no Bearer prefix. }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, tts_notification_id, shop_id, timestamp, data]
              properties:
                type: { type: integer, enum: [1, 4, 15], description: '1 order status; 4 package/shipment; 15 product.' }
                tts_notification_id: { type: string }
                shop_id: { type: string }
                timestamp: { type: integer, format: int64, description: Unix seconds of this attempt. }
                data: { type: object, additionalProperties: true }
            example: { type: 1, tts_notification_id: evt_example, shop_id: shop_example, timestamp: 1788566400, data: { order_id: ord_example, status: PAID } }
      responses: { '204': { description: Event durably accepted or already accepted }, '400': { description: Receiver rejected payload; simulator retries } }
components:
  securitySchemes:
    ControlPlaneBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
  parameters:
    ClientID: { name: X-Client-Id, in: header, required: true, schema: { type: string } }
    Timestamp: { name: X-Timestamp, in: header, required: true, schema: { type: string, description: Unix seconds } }
    Signature: { name: X-Signature, in: header, required: true, schema: { type: string, description: Hex HMAC-SHA256 of METHOD + PATH + TIMESTAMP + raw body } }
    ShopeePartnerID: { name: X-Shopee-Partner-Id, in: header, required: true, schema: { type: string }, description: Credential client ID used as the provider partner ID. }
    ShopeeTimestamp: { name: X-Shopee-Timestamp, in: header, required: true, schema: { type: string, description: Unix seconds. } }
    ShopeeSignature: { name: X-Shopee-Signature, in: header, required: true, schema: { type: string, description: Hex HMAC-SHA256 of PARTNER_ID + PATH + TIMESTAMP + raw body. } }
    TokopediaAppKey: { name: app_key, in: query, required: true, schema: { type: string }, description: Partner Center app key (the control-plane credential client ID). }
    TokopediaTimestamp: { name: timestamp, in: query, required: true, schema: { type: integer, format: int64 }, description: Unix seconds; accepted within five minutes. }
    TokopediaSign: { name: sign, in: query, required: true, schema: { type: string }, description: Hex HMAC-SHA256 of APP_SECRET + PATH + sorted query excluding sign/access_token + raw body + APP_SECRET. }
    TokopediaAccessToken: { name: x-tts-access-token, in: header, required: true, schema: { type: string }, description: Access token returned only when the control-plane credential is created. }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 255 }, description: Stable key for one logical mutation. Retrying the identical method, path, stable query, and body replays its completed response; a different payload returns 409. }
    PageLimit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    Cursor: { name: cursor, in: query, schema: { type: string }, description: Opaque cursor returned in pagination.next_cursor; keep the same sort and direction. }
    Direction: { name: direction, in: query, schema: { type: string, enum: [ASC, DESC], default: DESC } }
  headers:
    RateLimitLimit: { description: Configured requests allowed in the current minute for this credential., schema: { type: integer } }
    RateLimitRemaining: { description: Remaining requests in the current minute. Zero on a 429 response., schema: { type: integer, minimum: 0 } }
    RateLimitReset: { description: Unix timestamp when the quota window resets., schema: { type: integer, format: int64 } }
  schemas:
    ControlEvent:
      type: object
      required: [id, event_type, aggregate_id, aggregate_type, occurred_at, payload]
      properties:
        id: { type: string }
        event_type: { type: string, example: shipment.returned }
        aggregate_id: { type: string }
        aggregate_type: { type: string, enum: [order, product, shipment] }
        occurred_at: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true, description: Stored canonical domain payload. }
        deliveries:
          type: array
          items:
            type: object
            required: [id, event_id, status, attempt_count]
            properties:
              id: { type: string }
              event_id: { type: string }
              status: { type: string }
              attempt_count: { type: integer }
    ControlProductWarehouse:
      type: object
      required: [warehouse_id, code, name, status, priority, on_hand_quantity, reserved_quantity, available_quantity]
      properties:
        warehouse_id: { type: string }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        priority: { type: integer, description: Larger values win among eligible ACTIVE warehouses; ties use code alphabetically. }
        on_hand_quantity: { type: integer }
        reserved_quantity: { type: integer }
        available_quantity: { type: integer, description: On hand minus reserved. }
    ControlOrderDetail:
      type: object
      required: [id, shop_id, status, operations]
      additionalProperties: true
      properties:
        id: { type: string }
        shop_id: { type: string }
        status: { type: string, description: Canonical order status. }
        events: { type: array, items: { $ref: '#/components/schemas/ControlEvent' } }
        operations:
          type: object
          required: [provider_profile, provider_status, payment_status, available_actions, cancellation_options]
          additionalProperties: true
          properties:
            provider_profile: { type: string }
            provider_status: { type: string, description: Shopee retains canonical status. Tokopedia maps PAID to ON_HOLD, PROCESSING to AWAITING_SHIPMENT, READY_TO_SHIP to AWAITING_COLLECTION, SHIPPED/IN_DELIVERY to IN_TRANSIT, and CANCELLED/RETURNED to CANCEL. }
            payment_status: { type: string, enum: [PENDING, PAID, FAILED, EXPIRED] }
            available_actions: { type: array, items: { type: string, enum: [pay, payment_failed, process, ready_to_ship, complete] } }
            cancellation_options:
              type: array
              items:
                type: object
                required: [actor, reasons]
                properties:
                  actor: { type: string, enum: [CUSTOMER, SELLER] }
                  reasons: { type: array, items: { type: string } }
    ControlDeliveryAttempt:
      type: object
      required: [id, attempt, status, duration_ms, created_at, request_headers, response_headers]
      properties:
        id: { type: string }
        attempt: { type: integer }
        status: { type: string, enum: [SUCCESS, FAILURE] }
        duration_ms: { type: integer }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        request_url: { type: string, nullable: true }
        request_body: { type: string, nullable: true, description: Exact signed UTF-8 body; null for legacy or signing failure. Never parse/reserialize before signature verification. }
        request_headers: { type: object, additionalProperties: { type: string } }
        provider_profile: { type: string, nullable: true }
        signing_client_id: { type: string, nullable: true, description: Tokopedia app key used for this attempt; no secret. }
        http_attempted: { type: boolean, nullable: true }
        failure_code: { type: string, nullable: true, enum: [SIGNING_ERROR, FORCED_FAILURE, REQUEST_ERROR, NETWORK_ERROR, TIMEOUT, RESPONSE_READ_ERROR, HTTP_STATUS] }
        failure_reason: { type: string, nullable: true }
        response_status: { type: integer, nullable: true }
        response_headers: { type: object, additionalProperties: { type: string } }
        response_body: { type: string }
        response_body_truncated: { type: boolean, nullable: true }
    ControlDeliveryDetail:
      type: object
      required: [id, shop_id, event_id, status, attempt_count, attempts, webhook_deleted, webhook, event, provider_profile]
      properties:
        id: { type: string }
        shop_id: { type: string }
        event_id: { type: string }
        provider_profile: { type: string }
        status: { type: string, enum: [PENDING, DELIVERED, FAILED, CANCELLED] }
        attempt_count: { type: integer }
        webhook_deleted: { type: boolean }
        attempts: { type: array, items: { $ref: '#/components/schemas/ControlDeliveryAttempt' } }
        webhook:
          type: object
          required: [id, url, enabled, deleted]
          properties:
            id: { type: string }
            url: { type: string, description: Current registration URL; use attempt.request_url for historical evidence. }
            enabled: { type: boolean }
            deleted: { type: boolean }
        event:
          type: object
          required: [id, event_type, aggregate_id, aggregate_type, occurred_at, payload]
          properties:
            id: { type: string }
            event_type: { type: string }
            aggregate_id: { type: string }
            aggregate_type: { type: string, description: Resource family derived from the event name. }
            occurred_at: { type: string, format: date-time }
            payload: { type: object, additionalProperties: true, description: Canonical domain payload; not the provider HTTP envelope. }

    ControlPlaneSession:
      type: object
      required: [token, user]
      properties:
        token: { type: string, description: Bearer session token for the Control Plane. }
        user:
          type: object
          required: [id, email, role]
          properties:
            id: { type: string }
            email: { type: string, format: email }
            role: { type: string, enum: [OPERATOR] }
    WarehouseInventoryInput:
      type: object
      required: [warehouse_id, on_hand_quantity]
      properties:
        warehouse_id: { type: string }
        on_hand_quantity: { type: integer, minimum: 0 }
    ControlProductInput:
      type: object
      required: [sku, name, price, warehouse_inventory]
      properties:
        sku: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        category: { type: string }
        description: { type: string }
        price: { type: integer, format: int64, minimum: 0, description: Minor currency unit. }
        status: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE }
        warehouse_inventory: { type: array, minItems: 1, items: { $ref: '#/components/schemas/WarehouseInventoryInput' } }
    ControlProductPatch:
      type: object
      description: Partial catalogue metadata update. Omitted fields remain unchanged; physical inventory is intentionally excluded.
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        description: { type: string }
        price: { type: integer, format: int64, minimum: 0 }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    ControlProduct:
      type: object
      required: [id, shop_id, sku, name, category, description, price, stock, status]
      properties:
        id: { type: string }
        shop_id: { type: string }
        sku: { type: string }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        price: { type: integer, format: int64 }
        stock: { type: integer, description: Aggregate available quantity (on hand minus reserved) across all warehouses, including inactive warehouses. This alone does not guarantee single-warehouse allocation. }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    ProductInput:
      type: object
      required: [sku, name, price, stock]
      properties:
        sku: { type: string }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        price: { type: integer, format: int64, description: Minor currency unit }
        stock: { type: integer }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    ProductPatchInput:
      type: object
      description: Partial product update. Omitted fields remain unchanged; price and stock may explicitly be 0.
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        description: { type: string }
        price: { type: integer, format: int64, minimum: 0, description: Minor currency unit }
        stock: { type: integer, minimum: 0 }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          required: [id, shop_id, created_at, updated_at]
          properties:
            id: { type: string }
            shop_id: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    Pagination:
      type: object
      required: [next_cursor, has_more]
      properties:
        next_cursor: { type: string, description: Empty when no next page exists. }
        has_more: { type: boolean }
    ProductPage:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Product' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    OrderItem:
      type: object
      properties:
        id: { type: string }
        product_id: { type: string }
        sku: { type: string }
        product_name: { type: string }
        price: { type: integer, format: int64, description: Minor currency unit }
        quantity: { type: integer }
        subtotal: { type: integer, format: int64, description: Minor currency unit }
    ProviderOrderItem:
      type: object
      required: [id, product_id, sku, product_name, price, quantity, subtotal, allocated_quantity, remaining_quantity]
      properties:
        id: { type: string, example: ori_example_01 }
        product_id: { type: string, nullable: true, example: prd_example_01 }
        sku: { type: string, example: MUG-001 }
        product_name: { type: string, example: Ceramic Mug }
        price: { type: integer, format: int64, example: 125000 }
        quantity: { type: integer, example: 2 }
        subtotal: { type: integer, format: int64, example: 250000 }
        allocated_quantity: { type: integer, example: 1 }
        remaining_quantity: { type: integer, example: 1 }
    ProviderPackage:
      type: object
      required: [package_id, package_number, package_status, create_time, update_time]
      properties:
        package_id: { type: string, example: pkg_example_01 }
        package_number: { type: string, example: pkg_example_01, description: Compatibility alias of package_id. }
        package_status: { type: string, example: READY_TO_SHIP }
        create_time: { type: integer, format: int64, example: 1788627000 }
        update_time: { type: integer, format: int64, example: 1788627000 }
    ProviderShipment:
      type: object
      required: [id, package_id, order_id, tracking_number, shipping_provider, pickup_type, status, created_at]
      properties:
        id: { type: string, example: shp_example_01 }
        package_id: { type: string, example: pkg_example_01 }
        order_id: { type: string, example: ord_example_01 }
        tracking_number: { type: string, example: GXEXAMPLE01 }
        shipping_provider: { type: string, example: provider_express }
        pickup_type: { type: string, enum: [PICKUP] }
        status: { type: string, enum: [CREATED, SHIPPED, IN_DELIVERY, DELIVERED, DELIVERY_FAILED, RETURNING, RETURNED] }
        delivery_failure_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        shipped_at: { type: string, format: date-time, nullable: true }
        delivered_at: { type: string, format: date-time, nullable: true }
        failed_at: { type: string, format: date-time, nullable: true }
        returning_at: { type: string, format: date-time, nullable: true }
        returned_at: { type: string, format: date-time, nullable: true }
    CreatedShipment:
      type: object
      required: [id, package_id, warehouse_id, order_id, tracking_number, shipping_provider, pickup_type, status]
      properties:
        id: { type: string, example: shp_example_01 }
        package_id: { type: string, example: pkg_example_01 }
        warehouse_id: { type: string, example: wh_example_01 }
        order_id: { type: string, example: ord_example_01 }
        tracking_number: { type: string, example: GXEXAMPLE01 }
        shipping_provider: { type: string, example: provider_express }
        pickup_type: { type: string, enum: [PICKUP] }
        status: { type: string, enum: [CREATED] }
    ShopeeOrderDetail:
      type: object
      required: [order_id, order_sn, order_status, total_amount, buyer, recipient_address, create_time, update_time, item_list, package_list, shipment_list]
      properties:
        order_id: { type: string, example: ord_example_01 }
        order_sn: { type: string, example: SIM-EXAMPLE-01 }
        order_status: { type: string, example: READY_TO_SHIP }
        total_amount: { type: integer, format: int64, example: 250000 }
        buyer: { type: object, additionalProperties: true }
        recipient_address: { type: object, additionalProperties: true }
        create_time: { type: integer, format: int64 }
        update_time: { type: integer, format: int64 }
        item_list: { type: array, items: { $ref: '#/components/schemas/ProviderOrderItem' } }
        package_list: { type: array, items: { $ref: '#/components/schemas/ProviderPackage' } }
        shipment_list: { type: array, items: { $ref: '#/components/schemas/ProviderShipment' } }
    TokopediaOrderDetail:
      type: object
      required: [order_id, order_number, order_status, payment_status, total_amount, create_time, update_time, line_items, package_list, shipment_list]
      properties:
        order_id: { type: string, example: ord_example_01 }
        order_number: { type: string, example: SIM-EXAMPLE-01 }
        order_status: { type: string, example: AWAITING_COLLECTION }
        payment_status: { type: string, example: PAID }
        total_amount: { type: integer, format: int64, example: 250000 }
        create_time: { type: integer, format: int64 }
        update_time: { type: integer, format: int64 }
        line_items: { type: array, items: { $ref: '#/components/schemas/ProviderOrderItem' } }
        package_list: { type: array, items: { $ref: '#/components/schemas/ProviderPackage' } }
        shipment_list: { type: array, items: { $ref: '#/components/schemas/ProviderShipment' } }
    ShopeeOrderDetailEnvelope:
      type: object
      required: [error, message, request_id, response]
      properties:
        error: { type: string, example: '' }
        message: { type: string, example: success }
        request_id: { type: string }
        response: { $ref: '#/components/schemas/ShopeeOrderDetail' }
    TokopediaOrderDetailEnvelope:
      type: object
      required: [code, message, request_id, data]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: success }
        request_id: { type: string }
        data: { $ref: '#/components/schemas/TokopediaOrderDetail' }
    ShopeeShipmentCreatedEnvelope:
      type: object
      required: [error, message, request_id, response]
      properties:
        error: { type: string, example: '' }
        message: { type: string, example: success }
        request_id: { type: string }
        response:
          type: object
          required: [shipment]
          properties: { shipment: { $ref: '#/components/schemas/CreatedShipment' } }
    TokopediaShipmentCreatedEnvelope:
      type: object
      required: [code, message, request_id, data]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: success }
        request_id: { type: string }
        data:
          type: object
          required: [shipment]
          properties: { shipment: { $ref: '#/components/schemas/CreatedShipment' } }
    Payment:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [UNPAID, PAID] }
        reference: { type: string, nullable: true }
        paid_at: { type: string, format: date-time, nullable: true }
    Shipment:
      type: object
      required: [id, order_id, tracking_number, shipping_provider, status]
      properties:
        id: { type: string }
        order_id: { type: string }
        package_id: { type: string, nullable: true }
        warehouse_id: { type: string, nullable: true, description: Fulfillment warehouse selected by the linked order. }
        tracking_number: { type: string }
        shipping_provider: { type: string }
        pickup_type: { type: string, enum: [PICKUP] }
        status: { type: string, enum: [CREATED, SHIPPED, IN_DELIVERY, DELIVERED, DELIVERY_FAILED, RETURNING, RETURNED] }
        created_at: { type: string, format: date-time }
        shipped_at: { type: string, format: date-time, nullable: true }
        delivered_at: { type: string, format: date-time, nullable: true }
        delivery_failure_reason: { type: string, nullable: true }
        failed_at: { type: string, format: date-time, nullable: true }
        returning_at: { type: string, format: date-time, nullable: true }
        returned_at: { type: string, format: date-time, nullable: true }
    ShipmentInput:
      type: object
      required: [shipping_provider, pickup_type]
      properties:
        shipping_provider: { type: string, example: provider_express }
        pickup_type: { type: string, enum: [PICKUP] }
        package_id: { type: string, description: Existing package allocated for this order with no shipment yet. Omit to create a new package for remaining unallocated quantities; omission fails when none remain. Create every package shipment before progressing shipment movement. }
    PackageInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [order_item_id, quantity]
            properties:
              order_item_id: { type: string }
              quantity: { type: integer, minimum: 1 }
    WarehouseReference:
      type: object
      required: [warehouse_id, warehouse_code, warehouse_name]
      properties:
        warehouse_id: { type: string }
        warehouse_code: { type: string }
        warehouse_name: { type: string }
    WarehouseInventory:
      type: object
      required: [product_id, sku, product_name, on_hand_quantity, reserved_quantity, available_quantity]
      properties:
        product_id: { type: string }
        sku: { type: string }
        product_name: { type: string }
        on_hand_quantity: { type: integer, minimum: 0 }
        reserved_quantity: { type: integer, minimum: 0 }
        available_quantity: { type: integer, minimum: 0 }
        updated_at: { type: string, format: date-time }
    Warehouse:
      type: object
      required: [id, shop_id, code, name, status, priority, created_at, updated_at]
      properties:
        id: { type: string }
        shop_id: { type: string }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        address:
          type: object
          description: Dispatch address configured for this fulfillment origin. The compatibility default warehouse may have an empty address until an operator sets it in the control plane.
          properties:
            address_line: { type: string, example: Jl. Raya Bekasi 10 }
            city: { type: string, example: Jakarta }
            postal_code: { type: string, example: "13910" }
          additionalProperties: true
        priority: { type: integer, description: Larger values win among eligible ACTIVE warehouses; ties use code alphabetically. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        inventory: { type: array, items: { $ref: '#/components/schemas/WarehouseInventory' } }
    WarehouseList:
      type: object
      required: [data]
      description: Complete shop-scoped warehouse collection. This operation is intentionally unpaginated.
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Warehouse' } }
    PagePagination:
      type: object
      required: [page, limit, total, total_pages, has_previous, has_next]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 1 }
        has_previous: { type: boolean }
        has_next: { type: boolean }
    WebhookRegistration:
      type: object
      required: [id, shop_id, url, enabled, subscribed_events]
      properties:
        id: { type: string }
        shop_id: { type: string }
        url: { type: string, format: uri }
        enabled: { type: boolean }
        subscribed_events: { type: array, items: { type: string, enum: [product.created, product.updated, product.deleted, order.created, order.paid, order.payment_failed, order.payment_expired, order.processing, order.ready_to_ship, order.shipped, order.in_delivery, order.delivered, order.completed, order.cancelled, order.sla_expired, shipment.delivery_failed, shipment.returning, shipment.returned] } }
        secret: { type: string, writeOnly: true, description: Returned once when generated. Verifies Shopee delivery only; unused for Tokopedia which uses its oldest ACTIVE app credential. }
        created_at: { type: string, format: date-time, readOnly: true, description: Present in list responses. }
    WebhookList:
      type: object
      required: [data, pagination, delivery_contract]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/WebhookRegistration' } }
        pagination: { $ref: '#/components/schemas/PagePagination' }
        delivery_contract:
          type: object
          required: [provider_profile, signing_client_id]
          properties:
            provider_profile: { type: string, enum: [SHOPEE_LIKE, TOKOPEDIA_LIKE] }
            signing_client_id: { type: string, description: Oldest ACTIVE credential Client ID; empty when none. Used for Tokopedia deliveries only. }
    Error:
      type: object
      properties: { error: { type: object, properties: { code: { type: string }, message: { type: string } } } }
  responses:
    ShopeeResponse: { description: Successful SHOPEE_LIKE response, headers: { X-Shopee-Api-Call-Limit: { schema: { type: string }, description: Calls used/current limit. }, X-Shopee-RateLimit-Reset: { schema: { type: integer }, description: Unix reset time. } }, content: { application/json: { schema: { type: object, required: [error, message, request_id, response], properties: { error: { type: string, example: '' }, message: { type: string, example: success }, request_id: { type: string }, response: { type: object } } } } } }
    ShopeeOrderDetailResponse: { description: SHOPEE_LIKE order detail with complete item_list, package_list, and shipment_list collections., headers: { X-Shopee-Api-Call-Limit: { schema: { type: string }, description: Calls used/current limit. }, X-Shopee-RateLimit-Reset: { schema: { type: integer }, description: Unix reset time. } }, content: { application/json: { schema: { $ref: '#/components/schemas/ShopeeOrderDetailEnvelope' } } } }
    ShopeeShipmentCreatedResponse: { description: The one shipment created by this request. Read order detail shipment_list to retrieve every shipment for the order., headers: { X-Shopee-Api-Call-Limit: { schema: { type: string }, description: Calls used/current limit. }, X-Shopee-RateLimit-Reset: { schema: { type: integer }, description: Unix reset time. } }, content: { application/json: { schema: { $ref: '#/components/schemas/ShopeeShipmentCreatedEnvelope' } } } }
    ShopeeError: { description: SHOPEE_LIKE error, content: { application/json: { schema: { type: object, required: [error, message, request_id], properties: { error: { type: string, example: error_invalid_state }, message: { type: string }, request_id: { type: string } } } } } }
    TokopediaResponse: { description: Successful TOKOPEDIA_LIKE response, headers: { X-TTS-Api-Call-Limit: { schema: { type: integer } }, X-TTS-RateLimit-Reset: { schema: { type: integer, description: Unix reset time. } } }, content: { application/json: { schema: { type: object, required: [code, message, request_id, data], properties: { code: { type: integer, example: 0 }, message: { type: string, example: Success }, request_id: { type: string }, data: { type: object } } } } } }
    TokopediaOrderDetailResponse: { description: TOKOPEDIA_LIKE order detail with complete line_items, package_list, and shipment_list collections., headers: { X-TTS-Api-Call-Limit: { schema: { type: integer } }, X-TTS-RateLimit-Reset: { schema: { type: integer, description: Unix reset time. } } }, content: { application/json: { schema: { $ref: '#/components/schemas/TokopediaOrderDetailEnvelope' } } } }
    TokopediaShipmentCreatedResponse: { description: The one shipment created by this request. Read order detail shipment_list to retrieve every shipment for the order., headers: { X-TTS-Api-Call-Limit: { schema: { type: integer } }, X-TTS-RateLimit-Reset: { schema: { type: integer, description: Unix reset time. } } }, content: { application/json: { schema: { $ref: '#/components/schemas/TokopediaShipmentCreatedEnvelope' } } } }
    TokopediaError: { description: TOKOPEDIA_LIKE error, content: { application/json: { schema: { type: object, required: [code, message, request_id, data], properties: { code: { type: integer, example: 36000003 }, message: { type: string }, request_id: { type: string }, data: { type: object } } } } } }
    Error: { description: API error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Maintenance: { description: Global maintenance is enabled., content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: { code: MARKETPLACE_MAINTENANCE, message: marketplace is under maintenance } } } } }
    RateLimited: { description: Credential quota is exhausted or the per-shop rate-limit scenario is enabled., headers: { X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }, X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }, X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: { code: RATE_LIMIT_EXCEEDED, message: rate limit exceeded } } } } }
    RateLimitedProductPage: { description: Product page with credential quota headers., headers: { X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }, X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }, X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ProductPage' } } } }
    RateLimitedProduct: { description: Product response with credential quota headers., headers: { X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }, X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }, X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
    RateLimitedWarehouseList: { description: Warehouse list with credential quota headers., headers: { X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }, X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }, X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' } }, content: { application/json: { schema: { $ref: '#/components/schemas/WarehouseList' } } } }
    RateLimitedWarehouse: { description: Warehouse detail with credential quota headers., headers: { X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }, X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }, X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Warehouse' } } } }
    RateLimitedWebhookList: { description: Webhook list with credential quota headers., headers: { X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }, X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }, X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' } }, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookList' } } } }
    RateLimitedWebhookRegistration: { description: Webhook registration with credential quota headers. A generated secret is returned only by this create response., headers: { X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }, X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }, X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' } }, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookRegistration' } } } }
