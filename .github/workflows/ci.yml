name: Marketplace CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.5' }
      - uses: oven-sh/setup-bun@v2
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with: { working-directory: apps/marketplace, version: latest }
      - run: bun install --frozen-lockfile && bun run build
        working-directory: apps/marketplace/admin

  integration:
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: apps/marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.5' }
      - run: go test -race -tags=testcontainers ./integration ./cmd/worker
