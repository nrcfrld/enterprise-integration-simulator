name: Marketplace CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.14' }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.5' }
      - name: Reject generated-code drift
        run: make generate-check
      - name: Reject reachable Go vulnerabilities
        run: make vuln
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: make coverage-core
      - uses: golangci/golangci-lint-action@v6
        with: { working-directory: apps/marketplace, version: v2.11.4 }
      - run: bun install --frozen-lockfile
        working-directory: apps/marketplace/admin
      - run: bun run lint
        working-directory: apps/marketplace/admin
      - run: bun run typecheck
        working-directory: apps/marketplace/admin
      - run: bun run test:coverage
        working-directory: apps/marketplace/admin
      - run: bun run build
        working-directory: apps/marketplace/admin

  integration:
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: apps/marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.14' }
      - run: go test -race -tags=testcontainers ./integration ./cmd/worker

  browser-smoke:
    runs-on: ubuntu-latest
    needs: [quality, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.5' }
      - run: bun install --frozen-lockfile
        working-directory: apps/marketplace/admin
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: apps/marketplace/admin
      - name: Start Marketplace stack
        run: docker compose up --detach --build --wait
      - name: Run browser integration journey
        run: bun run test:browser
        working-directory: apps/marketplace/admin
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Marketplace stack
        if: always()
        run: docker compose down --volumes
