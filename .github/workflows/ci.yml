name: Marketplace CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.5' }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.5' }
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: make coverage-core
      - uses: golangci/golangci-lint-action@v6
        with: { working-directory: apps/marketplace, version: latest }
      - run: bun install --frozen-lockfile
        working-directory: apps/marketplace/admin
      - run: bun run lint
        working-directory: apps/marketplace/admin
      - run: bun run typecheck
        working-directory: apps/marketplace/admin
      - run: bun run test
        working-directory: apps/marketplace/admin
      - run: bun run build
        working-directory: apps/marketplace/admin

  integration:
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: apps/marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.5' }
      - run: go test -race -tags=testcontainers ./integration ./cmd/worker
